name: Sync audiobook queue

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into folders
        run: |
          mkdir -p sync site data
          for f in __init__.py __main__.py buy.py goodreads.py hoopla.py http.py libby.py matching.py notify.py; do
            [ -f "$f" ] && mv "$f" sync/
          done
          touch sync/__init__.py
          [ -f goodreads_library_export.csv ] && cp goodreads_library_export.csv data/ || true
          for f in index.html manifest.webmanifest icon.svg icon-180.png icon-512.png; do
            [ -f "$f" ] && cp "$f" site/
          done

      - name: Check Goodreads access
        run: |
          set +e
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            -o gr.html -w "status=%{http_code} final_url=%{url_effective}\n" \
            "https://www.goodreads.com/review/list/193243785?shelf=to-read"
          echo "page size: $(wc -c < gr.html) bytes"
          grep -o '<title>[^<]*' gr.html | head -1
          echo "book tables found: $(grep -c 'id="books"' gr.html)"
          echo "book rows found: $(grep -c 'id="review_' gr.html)"
          grep -io 'sign in to\|captcha\|robot\|private\|access denied\|not authorized' gr.html | sort | uniq -c | head
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Sync Goodreads, Libby, Hoopla, Audible
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m sync

      - name: Save state between runs
        run: |
          git config user.name  "queue-bot"
          git config user.email "queue-bot@users.noreply.github.com"
          git add data/state.json data/cache.json
          git diff --cached --quiet || git commit -m "sync: update state [skip ci]"
          git push || echo "state push skipped"

      - name: Publish website to gh-pages branch
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=queue-bot -c user.email=queue-bot@users.noreply.github.com commit -q -m "Update site"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
