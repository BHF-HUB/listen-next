name: Sync audiobook queue

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into folders
        run: |
          mkdir -p sync site data
          for f in __init__.py __main__.py buy.py goodreads.py hoopla.py http.py libby.py matching.py notify.py; do
            [ -f "$f" ] && cp "$f" sync/
          done
          touch sync/__init__.py
          for f in index.html manifest.webmanifest icon.svg icon-180.png icon-512.png; do
            [ -f "$f" ] && cp "$f" site/
          done
          ls sync site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync Goodreads, Libby, Hoopla, Audible
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m sync

      - name: Save state between runs
        run: |
          git config user.name  "queue-bot"
          git config user.email "queue-bot@users.noreply.github.com"
          git add data/state.json data/cache.json
          git diff --cached --quiet || git commit -m "sync: update state [skip ci]"
          git push || echo "state push skipped"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
